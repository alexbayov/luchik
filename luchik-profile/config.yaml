# Лучик — конфигурация
# Ключи провайдеров в .env (через ${VAR}), здесь только структура

model:
  default: kimi-k2.6
  provider: kimchi
  context_length: 131072
  max_tokens: 4096

providers:
  kimchi:
    discover_models: false
    transport: chat_completions
    base_url: https://llm.kimchi.dev/openai/v1
    api_key: ${KIMCHI_API_KEY}
    models:
    - id: kimi-k2.6
      name: Kimi K2.6 (Kimchi)
  openmodel:
    discover_models: false
    transport: anthropic_messages
    base_url: https://api.openmodel.ai
    api_key: ${OPENMODEL_API_KEY}
    models:
    - id: deepseek-v4-flash
      name: DeepSeek V4 Flash
  modelhub:
    discover_models: false
    transport: chat_completions
    base_url: https://modelhub.my/v1
    api_key: ${MODELHUB_API_KEY}
    models:
    - id: gpt-5.5
      name: GPT-5.5 (ModelHub)

fallback_providers:
- provider: openmodel
  model: deepseek-v4-flash

credential_pool_strategies: {}

toolsets:
- hermes-cli

agent:
  max_turns: 60
  gateway_timeout: 1800
  restart_drain_timeout: 180
  api_max_retries: 3
  service_tier: ''
  tool_use_enforcement: auto
  task_completion_guidance: true
  environment_probe: true
  environment_hint: ''
  gateway_timeout_warning: 900
  clarify_timeout: 600
  gateway_notify_interval: 180
  gateway_auto_continue_freshness: 3600
  image_input_mode: auto
  disabled_toolsets:
  - vision
  - video
  - image_gen
  - video_gen
  - computer_use
  - browser
  - tts
  - x_search
  - moa
  no_progress_k: 6
  personalities:
    luchik: 'Ты Лучик — редакторский ассистент. Прямой, энергичный, без воды. SOUL.md содержит полное описание личности.'

display:
  compact: false
  personality: luchik
  resume_display: full
  resume_exchanges: 10
  resume_max_user_chars: 300
  resume_max_assistant_chars: 200
  resume_max_assistant_lines: 3
  resume_skip_tool_only: true
  busy_input_mode: interrupt
  tui_auto_resume_recent: false
  tui_agents_nudge: true
  bell_on_complete: false
  show_reasoning: false
  streaming: true
  timestamps: false
  final_response_markdown: strip
  persistent_output: true
  persistent_output_max_lines: 200
  inline_diffs: true
  file_mutation_verifier: true
  turn_completion_explainer: true
  show_cost: false
  skin: default
  language: ru
  tui_status_indicator: kaomoji
  interim_assistant_messages: true

platform_toolsets:
  cli:
  - terminal
  - file
  - web
  - skills
  - todo
  - memory
  - session_search
  telegram:
  - hermes-telegram

memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 2200
  user_char_limit: 1375
  flush_min_turns: 6
  nudge_interval: 10

context:
  engine: compressor

compression:
  enabled: true
  threshold: 0.5
  target_ratio: 0.2
  protect_last_n: 20
  hygiene_hard_message_limit: 400
  protect_first_n: 3

security:
  allow_private_urls: false
  redact_secrets: true
  allow_lazy_installs: true
  allow_any_attachment: true

streaming: true
_config_version: 24

telegram:
  allowed_chats: ''
  channel_prompts: {}
  reactions: false

terminal:
  cwd: /Users/alex/luchik
